<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giant Steps</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="page">
  <header class="header">
    <div class="header-copy">
      <div class="eyebrow">GENERATOR PROTOTYPE</div>
      <h1>Giant Steps</h1>
      <p>four-note cells and 24 rhythmic permutations</p>
    </div>
    <div class="actions">
      <button id="generate" class="primary" type="button">Generate</button>
      <button id="rhythms" type="button">Randomize Rhythms</button>
      <button id="pentas" type="button">Shuffle Pitch Cells</button>
    </div>
  </header>

  <section class="fg-toolbar" aria-label="Giant Steps controls">
    <div class="fg-col fg-left">
      <div class="fg-row"><label for="tempo">Tempo</label><input id="tempo" type="range" min="40" max="240" step="1" value="80"><strong id="tempo-value">80 BPM</strong></div>
      <div id="fg-range" class="fg-row"><strong>Range:</strong><label for="fg-low">Low</label><select id="fg-low"></select><label for="fg-high">High</label><select id="fg-high"></select></div>
      <div class="fg-row modes"><button type="button" data-mode="angular" class="selected">Angular</button><button type="button" data-mode="smooth">Smooth</button><button type="button" data-mode="triadic">Triadic</button><button type="button" data-mode="quartal">Quartal</button><input id="gs-mode" type="hidden" value="angular"><label class="hat"><input type="checkbox" id="gs-hat"> Hi-hat 2 &amp; 4</label></div>
      <div class="fg-row"><label for="gs-order">Four-note order</label><select id="gs-order"><option value="random">Random</option><option value="straight">1–2–3–5</option><option value="retro">5–3–2–1</option><option value="inverted">1–3–2–5</option><option value="river">5–1–2–3</option><option value="enclosure">2–1–3–5</option></select></div>
    </div>
    <div class="fg-col fg-center">
      <div class="fg-row volume"><label for="gs-melvol">Melody Vol</label><input id="gs-melvol" type="range" min="0" max="1" step=".01" value=".7"><label for="gs-accvol">Accomp Vol</label><input id="gs-accvol" type="range" min="0" max="1" step=".01" value=".45"></div>
      <div class="fg-row"><label for="gs-melody-sound">Melody</label><select id="gs-melody-sound"><option value="rhodes">Rhodes</option><option value="piano">Piano</option></select><label for="gs-accomp-sound">Accomp</label><select id="gs-accomp-sound"><option value="piano">Piano</option><option value="rhodes">Rhodes</option></select></div>
      <div class="fg-row"><button id="gs-original" type="button">Original Melody</button><button id="generate" class="primary" type="button">Generate</button><button id="rhythms" type="button">Randomize Rhythms</button><button id="pentas" type="button">Shuffle Pitch Cells</button></div>
    </div>
    <div class="fg-col fg-right">
      <section id="fg-favorites" aria-label="Saved favorite charts"><div class="fg-row"><button id="fg-save" type="button">♡ Save Favorite</button><button id="fg-sign-in" hidden>Sign In</button><button id="fg-sign-out" hidden>Sign Out</button></div><div class="fg-row"><select id="fg-load" aria-label="Load favorite"><option value="">Load Favorite…</option></select><button id="fg-delete" type="button">Delete</button></div><small id="fg-auth-status">Favorites: saved in this browser</small><span id="fg-favorites-message" role="status"></span></section>
      <div class="fg-row downloads"><button id="gs-wav">↓ Download WAV</button><button id="gs-pdf">↓ PDF</button><button id="gs-midi">↓ Download MIDI</button></div>
    </div>
  </section>
  <section id="transport" aria-label="Playback controls"><button id="playPause" class="primary-control" type="button">▶ Play</button><button id="stopPlayback" type="button">■ Stop</button><span id="transport-status">Ready</span></section>
  <section id="score-section" aria-label="Generated notation">
    <div id="score"></div>
  </section>

  <table>
    <thead>
      <tr>
        <th>Measure</th>
        <th>Chord</th>
        <th>Rhythm</th>
        <th>Transcription</th>
        <th>Pitch cell</th>
        <th>Generated attacks</th>
      </tr>
    </thead>
    <tbody id="output"></tbody>
  </table>
</main>

<script src="https://cdn.jsdelivr.net/npm/abcjs@6.4.4/dist/abcjs-basic-min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="favorites-config.js"></script>
<script src="giant-steps-data.js"></script>
<script src="script.js"></script>

</body>
</html>
