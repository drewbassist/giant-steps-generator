<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Giant Steps</title>
<link href="favicon.png" rel="icon" type="image/png"/>
<link href="favicon.png" rel="apple-touch-icon"/>
<link href="style.css" rel="stylesheet"/>
</head>
<body>
<main class="page">
<header class="header">
<div class="header-copy">
<div class="eyebrow">GENERATOR PROTOTYPE</div>
<h1>Giant Steps</h1>
<p>four-note cells</p>
</div>

</header>
<div class="rule"></div>
<div class="subhead">16 bars · exact four-note chord cells · four bars per system</div>
<section aria-label="Giant Steps controls" id="gs-control-panel"><div class="gs-col gs-left"><div id="tempo-control">
<label for="tempo">Tempo</label>
<input id="tempo" max="240" min="40" step="1" type="range" value="80"/><span id="tempo-value">80 BPM</span>
</div><div aria-label="Melody note range" id="fg-range"><strong>Range:</strong><label for="fg-low">Low</label><select id="fg-low"></select><label for="fg-high">High</label><select id="fg-high"></select></div><div class="gs-style-row"><select id="gs-mode" aria-label="Melodic mode" hidden><option value="angular">Angular</option><option value="smooth">Smooth</option><option value="triadic">Triadic</option><option value="quartal">Quartal</option></select><div class="gs-style-buttons" role="group" aria-label="Melodic mode"><button type="button" data-mode="angular" class="selected">Angular</button><button type="button" data-mode="smooth">Smooth</button><button type="button" data-mode="triadic">Triadic</button><button type="button" data-mode="quartal">Quartal</button></div><label class="gs-hat"><input id="gs-hat" type="checkbox"/> Hi-hat 2 &amp; 4</label></div></div><div class="gs-col gs-middle"><label>Four-note ordering <select id="gs-order"><option value="random">Random</option><option value="straight">1–2–3–5</option><option value="retro">5–3–2–1</option><option value="inverted">1–3–2–5</option><option value="river">5–1–2–3</option><option value="enclosure">2–1–3–5</option></select></label><div class="gs-volume-row"><label>Melody volume <input id="gs-melvol" max="1" min="0" step=".01" type="range" value=".7"/></label><label>Accomp volume <input id="gs-accvol" max="1" min="0" step=".01" type="range" value=".7"/></label></div><div class="gs-action-row"><button id="gs-original">Original Melody</button><button class="primary" id="generate" type="button">Generate</button><button id="rhythms" type="button">Randomize Rhythms</button><button id="pentas" type="button">Shuffle Pitch Cells</button></div></div><div class="gs-col gs-right"><section aria-label="Saved favorite charts" id="fg-favorites">
<span id="fg-auth-status">Favorites: not signed in</span>
<button id="fg-sign-in" type="button">Sign In</button>
<button hidden="" id="fg-sign-out" type="button">Sign Out</button>
<button disabled="" id="fg-save" type="button">♡ Save Favorite</button>
<select aria-label="Load favorite" disabled="" id="fg-load"><option value="">Load Favorite…</option></select>
<button disabled="" id="fg-delete" type="button">Delete</button>
<span id="fg-favorites-message" role="status"></span>
</section><div class="gs-export-row"><button id="gs-wav">Download WAV</button><button id="gs-pdf">Print / Save PDF</button><button id="gs-midi">Download MIDI</button></div></div></section><section aria-label="Playback controls" id="transport">
<div id="transport-controls">
<button class="primary-control" id="playPause" type="button">▶ Play</button>
<button id="stopPlayback" type="button">■ Stop</button>
<span id="transport-status">Ready</span>
</div>

</section>



<section aria-label="Generated notation" id="score-section">
<div class="gs-print-heading" aria-hidden="true">Giant Steps</div>
<div id="score"></div>
</section>
<table>
<thead>
<tr>
<th>Measure</th>
<th>Chord</th>
<th>Rhythm</th>
<th>Transcription</th>
<th>Pitch cell</th>
<th>Generated attacks</th>
</tr>
</thead>
<tbody id="output"></tbody>
</table>
</main>
<script src="https://cdn.jsdelivr.net/npm/abcjs@6.4.4/dist/abcjs-basic-min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="favorites-config.js"></script>
<script src="giant-steps-data.js"></script>
<script src="script.js"></script>
</body>
</html>
